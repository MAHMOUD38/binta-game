<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Le Jeu de Binta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: #764ba2;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 16px;
            color: #999;
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: right;
            font-size: 12px;
            color: #999;
            margin-bottom: 25px;
        }

        .question-section {
            margin-bottom: 30px;
        }

        .question-number {
            font-size: 13px;
            color: #667eea;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 22px;
            font-weight: 600;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            background: #f8f9ff;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
            background: white;
            text-align: center;
            font-weight: 500;
        }

        .option:hover {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateY(-2px);
        }

        .option.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .finish-screen {
            text-align: center;
        }

        .finish-emoji {
            font-size: 60px;
            margin-bottom: 20px;
            animation: bounce 0.6s ease-out;
        }

        .finish-text {
            font-size: 24px;
            font-weight: 700;
            color: #764ba2;
            margin-bottom: 15px;
        }

        .finish-message {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: shake 0.3s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">🎮 Le Jeu de Binta</div>
            <div class="subtitle">Des questions coquines... 😏💋</div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">0/9</div>

        <div id="gameContent"></div>
    </div>

    <script>
        const questions = [
            {
                type: 'text',
                question: 'Quel est ton prénom ?',
                placeholder: 'Écris ici...'
            },
            {
                type: 'choice',
                question: 'Tu préfères que je touche tes fesses matin ou le soir ?',
                options: ['Le matin pour bien commencer 😏', 'Le soir quand on est au lit 🌙', 'Les deux ! 🔥', 'À chaque fois que tu as envie']
            },
            {
                type: 'choice',
                question: 'Est-ce que j\'aurais le droit de téter tes seins ?',
                options: ['Oui, bien sûr 😘', 'Oui, toute la nuit', 'Uniquement si tu es gentil 😏', 'C\'est un oui total 🔥']
            },
            {
                type: 'choice',
                question: 'Qu\'est-ce que tu aimes le plus chez moi physiquement ?',
                options: ['Tes yeux', 'Ton sourire', 'Ton corps', 'Tout chez toi 😍']
            },
            {
                type: 'choice',
                question: 'Comment tu décrirais notre chimie ?',
                options: ['Explosive 🔥', 'Douce et sensuelle', 'Parfaite', 'Addictive']
            },
            {
                type: 'text',
                question: 'Quel est le moment le plus sensuel qu\'on a partagé ?',
                placeholder: 'Écris ta réponse...'
            },
            {
                type: 'choice',
                question: 'Tu me préfères plutôt... ?',
                options: ['Tendre et doux', 'Passionné et intense', 'Joueur et amusant', 'Un mélange de tout']
            },
            {
                type: 'text',
                question: 'Quel est ton fantasme secret avec moi ? 😏',
                placeholder: 'Sois honnête...'
            },
            {
                type: 'text',
                question: 'Qu\'est-ce que tu voudrais qu\'on essaie ensemble ?',
                placeholder: 'Écris ta réponse...'
            }
        ];

        let currentQuestion = 0;
        const answers = [];

        function renderQuestion() {
            const container = document.getElementById('gameContent');
            const q = questions[currentQuestion];
            const progress = currentQuestion + 1;
            const total = questions.length;

            const percentage = (progress / total) * 100;
            document.getElementById('progressFill').style.width = percentage + '%';
            document.getElementById('progressText').textContent = `${progress}/${total}`;

            if (currentQuestion < questions.length) {
                let html = `
                    <div class="question-section">
                        <div class="question-number">Question ${progress}/${total}</div>
                        <div class="question-text">${q.question}</div>
                `;

                if (q.type === 'text') {
                    html += `
                        <div class="input-area">
                            <input type="text" id="answerInput" placeholder="${q.placeholder}" autofocus>
                        </div>
                        <div class="error-message" id="errorMsg">Écris quelque chose d'abord ! 😊</div>
                        <button onclick="handleTextAnswer()">Suivant →</button>
                    `;
                } else if (q.type === 'choice') {
                    html += '<div class="options">';
                    q.options.forEach((option, index) => {
                        html += `<div class="option" onclick="selectOption(${index})">${option}</div>`;
                    });
                    html += '</div><button onclick="handleChoiceAnswer()" style="margin-top: 20px;">Suivant →</button>';
                }

                html += '</div>';
                container.innerHTML = html;

                if (q.type === 'text') {
                    document.getElementById('answerInput').focus();
                    document.getElementById('answerInput').addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') handleTextAnswer();
                    });
                }
            }
        }

        let selectedOption = null;

        function selectOption(index) {
            selectedOption = index;
            document.querySelectorAll('.option').forEach((opt, i) => {
                opt.classList.toggle('selected', i === index);
            });
        }

        function handleTextAnswer() {
            const input = document.getElementById('answerInput');
            const errorMsg = document.getElementById('errorMsg');

            if (input.value.trim() === '') {
                errorMsg.classList.add('show');
                return;
            }

            answers.push(input.value.trim());
            currentQuestion++;

            if (currentQuestion < questions.length) {
                renderQuestion();
            } else {
                showFinish();
            }
        }

        function handleChoiceAnswer() {
            if (selectedOption === null) {
                alert('Sélectionne une réponse ! 😊');
                return;
            }

            answers.push(questions[currentQuestion].options[selectedOption]);
            selectedOption = null;
            currentQuestion++;

            if (currentQuestion < questions.length) {
                renderQuestion();
            } else {
                showFinish();
            }
        }

        function showFinish() {
            const container = document.getElementById('gameContent');
            const bintaName = answers[0];

            container.innerHTML = `
                <div class="finish-screen">
                    <div class="finish-emoji">🔥</div>
                    <div class="finish-text">C'est terminé !</div>
                    <div class="finish-message">
                        Wow, ${bintaName}... tes réponses sont tellement... 🔥<br><br>
                        Tu m'as donné tellement à penser... Tu me manques déjà. 😘<br><br>
                        À bientôt pour vérifier tout ça en vrai... 💕
                    </div>
                    <button onclick="location.reload()">Rejouer →</button>
                </div>
            `;
        }

        renderQuestion();
    </script>
</body>
</html>
